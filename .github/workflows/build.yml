name: Build Distributions

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: |
          # system libraries Qt needs for the offscreen tests
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          uv sync --locked --python "${{ steps.python.outputs.python-path }}"
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Tests
        run: uv run --no-sync pytest

  build:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        include:
          - os: ubuntu-22.04
            artifact_name: mscoder-linux-x64
            output_path: dist/mscoder
          - os: macos-14
            artifact_name: mscoder-macos-x64
            output_path: dist/mscoder
          - os: windows-2022
            artifact_name: mscoder-windows-x64.exe
            output_path: dist/mscoder.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: python
      with:
        python-version-file: .python-version
        architecture: 'x64'

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install dependencies
      run: uv sync --locked --python "${{ steps.python.outputs.python-path }}"

    - name: Build with PyInstaller
      run: uv run --no-sync pyinstaller mscoder.spec

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.output_path }}
        if-no-files-found: error
